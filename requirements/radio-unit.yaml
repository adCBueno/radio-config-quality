# Requirements for the simulated radio unit's carrier configuration.
# Every test that verifies a requirement is tagged with @pytest.mark.req("<id>"),
# which lets quality/traceability.py show what is covered, failing or untested.

- id: REQ-RU-001
  title: Convert between NR-ARFCN and frequency on the global raster
  source: 3GPP TS 38.104 5.4.2.1
- id: REQ-RU-002
  title: Reject an NR-ARFCN outside 0..3279165
  source: 3GPP TS 38.104 5.4.2.1
- id: REQ-RU-003
  title: A carrier must use a supported band and fit entirely inside its downlink range
  source: 3GPP TS 38.104 Table 5.2-1
- id: REQ-RU-004
  title: Only 15 kHz and 30 kHz subcarrier spacing are supported
  source: product
- id: REQ-RU-005
  title: The channel bandwidth must be valid for the subcarrier spacing
  source: 3GPP TS 38.101-1 Table 5.3.2-1
- id: REQ-RU-006
  title: Report the number of resource blocks (N_RB) of each active carrier
  source: 3GPP TS 38.101-1 Table 5.3.2-1
- id: REQ-RU-007
  title: Carrier power must be between 0 and 46 dBm
  source: product
- id: REQ-RU-008
  title: For FDD bands, the uplink carrier must fit inside the uplink range
  source: 3GPP TS 38.104 Table 5.2-1
- id: REQ-RU-009
  title: Carriers on the same radio unit must not overlap in downlink
  source: product
- id: REQ-RU-010
  title: A rejected configuration must leave the previous configuration unchanged
  source: product
- id: REQ-RU-011
  title: At most 4 carriers, each with a unique id
  source: product
