[project]
name = "radio-config-quality"
version = "0.1.0"
description = "Quality engineering for a simulated 5G NR radio unit: traceable requirements, property-based tests and AI-assisted test design"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "requests>=2.32.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rusim*", "quality*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.coverage.run]
source = ["rusim", "quality"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
